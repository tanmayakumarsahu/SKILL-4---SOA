spring.application.name=banking-jwt-api
server.port=8080

# Demo-only credentials. Override with environment variables for local experiments.
app.demo.username=${BANK_DEMO_USERNAME:bankuser}
app.demo.password=${BANK_DEMO_PASSWORD:BankPass123!}

# Replace this default with a long random secret outside local demos.
app.jwt.secret=${JWT_SECRET:change-this-demo-secret-key-to-a-long-random-value-2026}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
